services:
  - type: web
    name: courtpulse-backend
    env: docker
    plan: free # You can upgrade the instance type if needed
    region: singapore # Singapore (Southeast Asia)
    branch: main
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        sync: false # Set manually in Render dashboard
      - key: DB_USERNAME
        sync: false # Set manually in Render dashboard
      - key: DB_PASSWORD
        sync: false # Set manually in Render dashboard
      - key: JWT_SECRET
        sync: false # Set manually in Render dashboard
