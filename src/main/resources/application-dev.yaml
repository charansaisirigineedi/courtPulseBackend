spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/courtpulse
    username: courtpulse
    password: password

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: true

    properties:
      hibernate:
        format_sql: true
        generate_statistics: true

  flyway:
    enabled: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
