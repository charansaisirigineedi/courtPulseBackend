spring:
  application:
    name: courtpulse

  cache:
    type: caffeine

  jpa:
    open-in-view: false

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

app:
  security:
    jwt:
      issuer: courtpulse
      secret: ${JWT_SECRET:courtpulse-local-development-secret-please-change}
      access-token-expiration-minutes: 60
